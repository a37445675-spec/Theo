# ============================================================
#  NAWA Commerce — Stack complète
#  Django + PostgreSQL + Redis + Nginx (frontend)
# ============================================================
version: "3.9"

services:
  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    container_name: nawa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nawa_commerce}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Decembre2}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Redis ===
  redis:
    image: redis:7-alpine
    container_name: nawa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Backend Django ===
  backend:
    build:
      context: ./nawa-commerce
      dockerfile: Dockerfile
    container_name: nawa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./nawa-commerce/.env.docker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "True"
      CREATE_SUPERUSER: "true"
    volumes:
      - ./nawa-commerce/media:/app/media
      - ./nawa-commerce/staticfiles:/app/staticfiles
      - ./nawa-commerce/logs:/app/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/design-system/active/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # === Frontend Nginx ===
  frontend:
    build:
      context: ./nawa-shop-frontend
      dockerfile: Dockerfile
    container_name: nawa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: nawa-network
