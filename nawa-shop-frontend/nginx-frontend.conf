server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # === Compression Gzip ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # === Proxy API vers le backend Railway ===
    location /api/ {
        proxy_pass https://theo-production-c85a.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host theo-production-c85a.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Proxy Admin Django ===
    location /admin/ {
        proxy_pass https://theo-production-c85a.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host theo-production-c85a.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Proxy Media (images uploadées) ===
    location /media/ {
        proxy_pass https://theo-production-c85a.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host theo-production-c85a.up.railway.app;
    }

    # === Proxy Static (admin CSS/JS) ===
    location /static/ {
        proxy_pass https://theo-production-c85a.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host theo-production-c85a.up.railway.app;
    }

    # === SPA Fallback (React Router) ===
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # === Assets statiques (cache 1 an) ===
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # === Headers de sécurité ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}