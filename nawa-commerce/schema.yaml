openapi: 3.0.3
info:
  title: NAWA Commerce API
  version: 1.0.0
  description: API REST de la plateforme e-commerce multi-verticales NAWA.
paths:
  /api/v1/announcements/:
    get:
      operationId: v1_announcements_list
      description: |-
        API publique en lecture seule.

        GET /api/v1/announcements/                       → toutes les annonces actives
        GET /api/v1/announcements/?position=top_bar      → filtrées par position
        GET /api/v1/announcements/?position=popup        → popup
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
          description: ''
  /api/v1/announcements/{id}/:
    get:
      operationId: v1_announcements_retrieve
      description: |-
        API publique en lecture seule.

        GET /api/v1/announcements/                       → toutes les annonces actives
